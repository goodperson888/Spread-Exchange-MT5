name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test trading button requests
        run: node --test tests/trading_ui.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Build and self-test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: GoldPairLocal-Windows
          path: dist/GoldPairLocal-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish online download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/GoldPairLocal-Windows.zip \
            --title "GoldPairLocal Windows build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA}. Test with a logged-in MT5 terminal before live use." \
            --target "${GITHUB_SHA}"
          link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/GoldPairLocal-Windows.zip"
          {
            echo "## Windows package"
            echo
            echo "[Download GoldPairLocal-Windows.zip](${link})"
            echo
            echo "This link is the release asset for this build."
          } >> "$GITHUB_STEP_SUMMARY"
