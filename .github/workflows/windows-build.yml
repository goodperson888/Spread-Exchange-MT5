name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Build and self-test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: GoldPairLocal-Windows
          path: dist/GoldPairLocal-Windows.zip
          if-no-files-found: error
          retention-days: 14
